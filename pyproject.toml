[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crashback"
version = "0.1.0"
description = "Short-term stock-price recovery prediction after large crashes (research pipeline)."
readme = "README.md"
# Upper-bounded: `wrds` pins pandas<2.3, but pandas<2.3 segfaults on Python 3.14
# (pandas added 3.14 support only in 2.3+). 3.12/3.13 are the supported interpreters.
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Studio R42" }]

dependencies = [
    # bulk data / analytics
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    # config / validation
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # modeling
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    # V2 crash-cause extraction (LLM)
    "anthropic>=0.40",
    # figures for the writeup
    "matplotlib>=3.7",
    # data provider (WRDS: CRSP + Compustat)
    "wrds>=3.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crashback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import the package from src/ directly, so the suite does not depend on the state of an
# editable install (hatchling's editable .pth proved unreliable on this interpreter).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Curated baseline: pycodestyle/pyflakes + import sorting + pyupgrade + bugbear.
select = ["E", "F", "I", "UP", "B"]
